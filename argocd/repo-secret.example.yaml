# Só necessário se o repositório for PRIVADO. Use um PAT com escopo "repo" (leitura).
apiVersion: v1
kind: Secret
metadata:
  name: repo-poc-frontend
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://github.com/<SEU-USUARIO>/poc-frontend-nodejs.git
  username: <SEU-USUARIO>
  password: <GITHUB_PAT>
