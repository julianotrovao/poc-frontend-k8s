# SonarQube Community + PostgreSQL na VM de CI.
# Pré-requisito no host:  sudo sysctl -w vm.max_map_count=524288  (persistir em /etc/sysctl.d/99-sonar.conf)
services:
  db-sonar:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar-poc-123
      POSTGRES_DB: sonarqube
    volumes:
      - sonar_db:/var/lib/postgresql/data
    restart: unless-stopped
  sonarqube:
    image: sonarqube:community
    depends_on: [db-sonar]
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db-sonar:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar-poc-123
    ports:
      - "9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    restart: unless-stopped
volumes:
  sonar_db:
  sonar_data:
  sonar_extensions:
  sonar_logs:
