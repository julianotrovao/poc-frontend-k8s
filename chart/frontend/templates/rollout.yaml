{{- if .Values.rollout.enabled }}
# Canary com Argo Rollouts + ingress-nginx (divisão real de tráfego por peso).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "frontend.fullname" . }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "frontend.selectorLabels" . | nindent 6 }}
  template:
    {{- include "frontend.podTemplate" . | nindent 4 }}
  strategy:
    canary:
      stableService: {{ include "frontend.fullname" . }}
      canaryService: {{ include "frontend.fullname" . }}-canary
      trafficRouting:
        nginx:
          stableIngress: {{ include "frontend.fullname" . }}
      steps:
        - setWeight: 20
        - pause: { duration: {{ .Values.rollout.pauseSeconds }}s }
        {{- if .Values.rollout.analysis.enabled }}
        - analysis:
            templates:
              - templateName: {{ include "frontend.fullname" . }}-success-rate
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        {{- end }}
        - setWeight: 50
        - pause: { duration: {{ .Values.rollout.pauseSeconds }}s }
        - setWeight: 100
{{- end }}
